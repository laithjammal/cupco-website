<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* ===================================================================
   CUPCO CUSTOMER REVIEWS — review-card strip
   Paste this whole file into a Wix "Embed HTML / iframe" element.

   >>> COLOURS AND FONTS ARE THE BLOCK BELOW. Change these only. <<<
   =================================================================== */
:root{
  --rev-bg:      transparent;  /* sits on whatever Wix section colour is behind it */
  --rev-card:    #FFFFFF;  /* review card */
  --rev-text:    #1D2B24;  /* review text */
  --rev-name:    #17352A;  /* reviewer name */
  --rev-sub:     #6B7B70;  /* the line under the name */
  --rev-border:  #E3E8E3;  /* card edge */
  --rev-star:    #F2A33C;  /* star colour — amber is what people read as a rating */

  --rev-font-body:  -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

  --rev-speed:   52s;      /* higher = slower */
  --rev-card-w:  clamp(260px, 78vw, 330px);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--rev-bg)}
body{font-family:var(--rev-font-body);-webkit-font-smoothing:antialiased}

.rev{background:var(--rev-bg);padding:8px 0;overflow:hidden}


.rev-window{
  -webkit-mask-image:linear-gradient(to right,transparent,#000 40px,#000 calc(100% - 40px),transparent);
          mask-image:linear-gradient(to right,transparent,#000 40px,#000 calc(100% - 40px),transparent);
}
.rev-track{
  display:flex;gap:16px;width:max-content;padding:4px 20px;
  animation:rev-marquee var(--rev-speed) linear infinite;
}
.rev-window:hover .rev-track,
.rev-window:focus-within .rev-track{animation-play-state:paused}

.rev-card{
  flex:none;width:var(--rev-card-w);margin:0;
  background:var(--rev-card);border:1px solid var(--rev-border);
  border-radius:8px;padding:14px 15px 15px;
  box-shadow:0 1px 2px rgba(0,0,0,.06), 0 6px 18px rgba(0,0,0,.10);
}

.rev-head{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.rev-avatar{
  flex:none;position:relative;overflow:hidden;
  width:38px;height:38px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:600;font-size:16px;line-height:1;
}
/* DEMO PHOTOS — a reviewer with a photo gets class "has-photo ph-<name>".
   The photo is a small face crop embedded below as a data URI, so this file
   stays one self-contained paste. The coloured initial stays in the markup
   (hidden behind the photo) as the fallback — a reviewer WITHOUT a photo
   (Rohan B. in this demo) just shows the initial, like Google does.
   To use a real photo/logo: swap the data URI for a hosted image URL.
   Each reviewer appears TWICE in the markup (the duplicate set keeps the
   scroll seamless) — update both copies or the face will change mid-loop. */
.rev-avatar.has-photo{
  color:transparent;
  background-size:cover;background-position:center;background-repeat:no-repeat;
}
