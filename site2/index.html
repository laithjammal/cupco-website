<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cupco – Custom Cups</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#58aef8; --blue-dark:#3f95ea; --coral:#F2A095; --navy:#20394B; --white:#fff;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Poppins',system-ui,sans-serif;color:var(--white);background:var(--blue)}
a{color:inherit;text-decoration:none}

.hero{
  position:relative;min-height:100vh;overflow:hidden;
  background:
    url("assets/hero.jpg") right center/cover no-repeat,
    linear-gradient(180deg,#5aaff8 0%,#6ebbfb 100%);
}

/* header */
.nav{
  position:relative;z-index:2;display:grid;grid-template-columns:1fr auto 1fr;
  align-items:center;padding:20px 40px;
}
.nav-links{display:flex;gap:36px;font-weight:600;font-size:15px;white-space:nowrap}
.nav-links a:hover{opacity:.8}
.logo{display:block;height:34px}
.logo img{height:100%;display:block}
.logo span{font-weight:800;font-size:28px;letter-spacing:-.5px;line-height:1}
.call{
  justify-self:end;border:1.5px solid var(--white);border-radius:999px;
  padding:10px 42px;font-weight:600;font-size:15px;transition:background .2s,color .2s;
}
.call:hover{background:var(--white);color:var(--blue-dark)}

/* copy */
.copy{
  position:absolute;z-index:2;left:40px;top:50%;transform:translateY(-8%);
  max-width:none;
}
.copy h1{white-space:nowrap;
  font-weight:800;color:var(--coral);text-transform:uppercase;
  font-size:clamp(48px,7.2vw,92px);line-height:1;letter-spacing:-1px;
}
.ready{margin:14px 0 0 78px;font-weight:800;font-size:clamp(20px,2.2vw,26px);color:var(--white)}
.min{margin:14px 0 0 180px;font-weight:800;font-size:clamp(20px,2.2vw,26px);color:#000}
.cta{
  display:inline-block;margin:22px 0 0 199px;background:var(--coral);color:#3b2a28;
  font-weight:600;font-size:18px;padding:16px 38px;border-radius:999px;
  transition:transform .15s,background .15s;
}
.cta:hover{transform:translateY(-2px);background:#f7b0a2}

/* tablet / phone: stack the copy, drop the stagger */
@media(max-width:900px){
  .nav{grid-template-columns:auto 1fr auto;padding:16px 20px;gap:12px}
  .nav-links{display:none}
  .logo{grid-column:1}
  .call{grid-column:3;padding:9px 24px}
  .hero{background-position:70% bottom;background-size:auto 55%,cover;
    background-image:url("assets/hero.jpg"),linear-gradient(180deg,#5aaff8,#6ebbfb)}
  .copy{left:20px;right:20px;top:110px;transform:none;max-width:none}
  .ready,.min,.cta{margin-left:0}
  .cta{margin-top:22px}
}
</style>
</head>
<body>
<header class="hero">
  <nav class="nav">
    <div class="nav-links">
      <a href="#pricing">Pricing</a>
      <a href="#process">The Process</a>
      <a href="#customers">Our Customers</a>
      <a href="#roi">ROI</a>
      <a href="#contact">Contact Us</a>
    </div>
    <a class="logo" href="/" aria-label="Cupco">
      <img src="assets/logo-white.png" alt="Cupco" onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:'cupco'}))">
    </a>
    <a class="call" href="tel:">Call Now</a>
  </nav>

  <div class="copy">
    <h1>Custom Cups</h1>
    <p class="ready">Ready in 10 days</p>
    <p class="min">No Minimum Order</p>
    <a class="cta" href="#contact">Pre-order now</a>
  </div>
</header>
</body>
</html>
